[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrorainprotect"
version = "0.1.0"
description = "Radar-based rain alarm that pushes to ntfy"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.0",
  # The eccodes wheels for CPython <= 3.13 bundle an eckit-free libeccodes; newer eccodeslib
  # wheels drag in ~125 MB of eckit that this project never calls. Python 3.14 has no such
  # wheel yet, so it keeps the current binding (issue #12).
  "eccodes==2.39.2; python_version < '3.14'",
  "eccodes>=2.40; python_version >= '3.14'",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
astrorainprotect = "astrorainprotect.app:main"

[tool.hatch.build.targets.wheel]
packages = ["astrorainprotect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs network access to S3; skipped when offline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
