[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrorainprotect"
version = "0.1.0"
description = "Radar-based rain alarm that pushes to ntfy"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.0",
  # The eccodes 2.39.2 x86_64 wheels for CPython <= 3.13 bundle an eckit-free libeccodes;
  # newer eccodeslib wheels drag in ~125 MB of eckit that this project never calls. There is
  # no such wheel for Python 3.14 or for aarch64, so those keep the current binding (#12).
  "eccodes==2.39.2; python_version < '3.14' and platform_machine == 'x86_64'",
  "eccodes>=2.40; python_version >= '3.14' or platform_machine != 'x86_64'",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
astrorainprotect = "astrorainprotect.app:main"

[tool.hatch.build.targets.wheel]
packages = ["astrorainprotect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs network access to S3; skipped when offline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
